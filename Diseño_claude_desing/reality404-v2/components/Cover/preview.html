<!doctype html>
<html lang="es" data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../shared/bundle.css"><script src="../../shared/bundle.js"></script><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--void); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--void); }
  svg { position: absolute; left: 0; top: 0; }
  .b1 { fill: var(--frost-100); } .b2 { fill: var(--frost-200); } .b3 { fill: var(--frost-300); } .b4 { fill: var(--surface-raised); } .b5 { fill: var(--frost-400); }
  .tube { fill: none; stroke: var(--frost-100); stroke-width: 2; }
  .tube-dark { fill: none; stroke: var(--void); stroke-width: 2; }
  .text { position: absolute; left: 40px; bottom: 40px; width: 440px; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: .95; letter-spacing: -0.04em; color: var(--ink); margin: 0; }
  .tag { font-family: var(--font-body); font-size: 14px; color: var(--ink-muted); margin: 12px 0 0; }
</style></head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!-- blocks: frost-100 (264×168, radius-pill → píldora), frost-200 (120×288 sangrando arriba/abajo), frost-300 (168×120), surface-raised (264×96), frost-400 (60×60 disco)
         arrangement: una losa alta (frost-200) con satélites en píldora, sangrando por la derecha y por arriba, como los tubos del fondo 404
         pattern: "a literal motif" → tubos huecos en píldora (radius-pill) con trazo de 2px, porque la marca ES vidrio/cromo en forma de tubo líquido
         scales: space-5 24, space-6 40, space-7 60, space-8 120; radius-pill (rx = mitad del lado corto), radius-xl 28 -->
    <rect class="b4" x="520" y="24" width="264" height="96" rx="28"/>
    <rect class="b2" x="804" y="-28" width="120" height="344" rx="60"/>
    <rect class="b1" x="560" y="144" width="264" height="168" rx="84"/>
    <rect class="b3" x="480" y="168" width="60" height="120" rx="30"/>
    <circle class="b5" cx="934" cy="60" r="30"/>
    <rect class="tube" x="544" y="40" width="216" height="60" rx="30"/>
    <rect class="tube-dark" x="590" y="176" width="204" height="104" rx="52"/>
    <rect class="tube-dark" x="824" y="40" width="80" height="208" rx="40"/>
    <rect class="tube" x="864" y="200" width="120" height="60" rx="30"/>
  </svg>
  <div class="text">
    <h1 class="name">reality404</h1>
    <p class="tag">Developer, design and workflows with AI</p>
  </div>
</div>
</body>
</html>

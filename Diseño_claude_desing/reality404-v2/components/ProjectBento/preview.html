<!-- @dsCard group="Proyectos" height=720 subtitle="Bento grid: tilt 3D y brillo que siguen al ratón, el vídeo arranca al pasar" -->
<!doctype html>
<html lang="es" data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../shared/bundle.css"><script src="../../shared/bundle.js"></script><meta charset="utf-8"><title>ProjectBento — preview</title>
<style>
  .bento-wrap { padding: 24px; display: flex; flex-direction: column; gap: 20px; min-height: 720px; }
  .bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 150px; gap: 14px; perspective: 1000px; }
  .tile { position: relative; border-radius: var(--radius-lg); overflow: hidden; cursor: pointer; text-align: left; padding: 0; color: var(--ink);
    transform-style: preserve-3d; transition: transform var(--duration-base) var(--ease-liquid), box-shadow var(--duration-base); }
  .tile:hover, .tile:focus-visible { box-shadow: var(--shadow-frost-glow), var(--shadow-lift); }
  .tile .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.2) 60%, transparent); }
  .tile .glare { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity var(--duration-fast);
    background: radial-gradient(circle at var(--gx,50%) var(--gy,50%), rgba(255,255,255,.22), transparent 45%); }
  .tile:hover .glare { opacity: 1; }
  .tile .meta { position: absolute; left: 18px; right: 18px; bottom: 16px; transform: translateZ(40px); }
  .tile h3 { margin: 0; font: 600 20px/1.2 var(--font-display); }
  .tile p { margin: 5px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-muted); max-height: 0; opacity: 0; overflow: hidden; transition: max-height var(--duration-base) var(--ease-liquid), opacity var(--duration-base); }
  .tile:hover p, .tile:focus-visible p, .tile.big p { max-height: 60px; opacity: 1; }
  .tile .arrow { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px;
    background: rgba(0,0,0,.4); border: 1px solid var(--glass-edge); transform: translateZ(30px) rotate(-45deg); transition: transform var(--duration-base) var(--ease-spring), background var(--duration-fast); }
  .tile:hover .arrow { background: var(--frost-100); color: var(--on-frost); transform: translateZ(30px) rotate(0); }
  .t0 { grid-column: span 2; grid-row: span 2; } .t1 { grid-column: span 2; } .t2 { grid-column: span 1; } .t3 { grid-column: span 1; grid-row: span 2; } .t4 { grid-column: span 2; }
  .tile.t2 h3, .tile.t3 h3 { font-size: 17px; }
  .head { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
</style></head>
<body>
<div id="root" class="r4-stage bento-wrap">
  <div class="head">
    <div><div class="r4-eyebrow">Proyectos</div><h2 class="r4-title" style="font-size:34px;margin-top:8px">Cosas que he construido</h2></div>
    <div id="tablet" style="flex:none;transform:scale(.72);transform-origin:right bottom;margin:-40px 0 0"></div>
  </div>
  <div class="bento" id="bento"></div>
  <div class="r4-hint">Pasa el ratón: tilt + brillo + vídeo · clic para abrir en la tablet</div>
</div>
<script>
(function () {
  var R = window.R4, P = R.PROJECTS, grid = document.getElementById('bento');
  var tablet = R.miniTablet(document.getElementById('tablet'));
  P.forEach(function (p, i) {
    var t = R.el('button', 'tile r4-glass t' + i + (i === 0 ? ' big' : '')); t.setAttribute('aria-label', 'Abrir ' + p.title + ' en la tablet');
    var m = R.media(p, t);
    t.appendChild(R.el('div', 'shade')); t.appendChild(R.el('div', 'glare'));
    t.appendChild(R.el('span', 'arrow', '&#8594;'));
    t.appendChild(R.el('div', 'meta', '<h3>' + p.title + '</h3><p>' + p.desc + '</p>'));
    var raf;
    t.addEventListener('pointermove', function (e) {
      if (R.reduced) return; var r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      cancelAnimationFrame(raf); raf = requestAnimationFrame(function () {
        t.style.transform = 'rotateX(' + (0.5 - y) * 10 + 'deg) rotateY(' + (x - 0.5) * 12 + 'deg) translateZ(10px)';
        t.style.setProperty('--gx', x * 100 + '%'); t.style.setProperty('--gy', y * 100 + '%');
      });
    });
    t.addEventListener('pointerenter', function () { m.play(); });
    t.addEventListener('pointerleave', function () { m.pause(); t.style.transform = ''; });
    t.addEventListener('focus', function () { m.play(); }); t.addEventListener('blur', function () { m.pause(); });
    t.addEventListener('click', function () { R.flyTo(t, tablet.screen, function () { tablet.show(p); }); });
    grid.appendChild(t);
  });
})();
</script>
</body>
</html>

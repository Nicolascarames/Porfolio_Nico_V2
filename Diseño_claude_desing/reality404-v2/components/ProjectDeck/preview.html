<!-- @dsCard group="Proyectos" height=660 subtitle="Baraja de vidrio: arrastra y lanza la tarjeta, clic para abrir en la tablet" -->
<!doctype html>
<html lang="es" data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../shared/bundle.css"><script src="../../shared/bundle.js"></script><meta charset="utf-8"><title>ProjectDeck — preview</title>
<style>
  .deck-wrap { padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 22px; min-height: 660px; }
  .deck { position: relative; height: 340px; perspective: 1400px; touch-action: pan-y; }
  .deck-card { position: absolute; left: 50%; top: 0; width: min(440px, 82%); aspect-ratio: 3/2; margin-left: calc(min(440px, 82%) / -2);
    border-radius: var(--radius-lg); overflow: hidden; cursor: grab; user-select: none; will-change: transform;
    transition: transform var(--duration-base) var(--ease-liquid), opacity var(--duration-base), filter var(--duration-base); }
  .deck-card.dragging { transition: none; cursor: grabbing; box-shadow: var(--shadow-lift), var(--shadow-glass); }
  .deck-card .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.95) 10%, rgba(0,0,0,.55) 50%, rgba(0,0,0,.05)); }
  .deck-card .meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px; }
  .deck-card h3 { margin: 0; font: 600 22px/1.2 var(--font-display); }
  .deck-card p { margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: var(--ink-muted); }
  .tags { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .tag { font: 600 11px/1 var(--font-display); padding: 6px 9px; border-radius: var(--radius-pill); background: rgba(255,255,255,.08); border: 1px solid var(--glass-edge); }
  .deck-nav { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--frost-400); border: 0; padding: 0; cursor: pointer; transition: width var(--duration-base) var(--ease-liquid), background var(--duration-fast); }
  .dot[aria-current="true"] { width: 26px; background: var(--frost-100); box-shadow: 0 0 10px rgba(223,225,236,.5); }
</style></head>
<body>
<div id="root" class="r4-stage deck-wrap">
  <div id="tablet"></div>
  <div class="deck" id="deck" role="region" aria-roledescription="carrusel" aria-label="Proyectos"></div>
  <div class="deck-nav">
    <button class="r4-btn-ghost r4-icon-btn" id="prev" aria-label="Proyecto anterior">&#8592;</button>
    <div class="dots" id="dots"></div>
    <button class="r4-btn-ghost r4-icon-btn" id="next" aria-label="Proyecto siguiente">&#8594;</button>
  </div>
  <div class="r4-hint">Arrastra o lanza la tarjeta · ← → con teclado · clic / Enter para abrir en la tablet</div>
</div>
<script>
(function () {
  var R = window.R4, P = R.PROJECTS, deck = document.getElementById('deck'), dots = document.getElementById('dots');
  var tablet = R.miniTablet(document.getElementById('tablet'));
  var order = P.map(function (_, i) { return i; }); // order[0] = tarjeta de arriba
  var cards = P.map(function (p, i) {
    var c = R.el('div', 'deck-card r4-glass'); c.tabIndex = 0; c.setAttribute('role', 'button'); c.setAttribute('aria-label', 'Abrir ' + p.title + ' en la tablet');
    c._m = R.media(p, c);
    c.appendChild(R.el('div', 'shade'));
    c.appendChild(R.el('div', 'meta', '<h3>' + p.title + '</h3><p>' + p.desc + '</p><div class="tags">' + p.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>'));
    deck.appendChild(c); return c;
  });
  P.forEach(function (p, i) { var d = R.el('button', 'dot'); d.setAttribute('aria-label', p.title); d.onclick = function () { goTo(i); }; dots.appendChild(d); });

  function layout() {
    order.forEach(function (idx, pos) {
      var c = cards[idx], fan = Math.min(pos, 3);
      c.style.zIndex = 10 - pos;
      c.style.transform = 'translate3d(' + fan * 26 + 'px,' + fan * 14 + 'px,' + (-fan * 70) + 'px) rotate(' + fan * 3.5 + 'deg)';
      c.style.opacity = pos > 3 ? 0 : 1 - fan * .12;
      c.style.filter = pos ? 'brightness(' + (1 - fan * .18) + ') blur(' + fan * .6 + 'px)' : 'none';
      c.style.pointerEvents = pos ? 'none' : 'auto';
      if (pos === 0) c._m.play(); else c._m.pause();
    });
    [].forEach.call(dots.children, function (d, i) { d.setAttribute('aria-current', i === order[0]); });
  }
  function cycle(dir) { if (dir > 0) order.push(order.shift()); else order.unshift(order.pop()); layout(); }
  function goTo(i) { while (order[0] !== i) order.push(order.shift()); layout(); }
  function open(c, p) { R.flyTo(c, tablet.screen, function () { tablet.show(p); }); }

  /* Arrastre con lanzamiento */
  var sx, sy, dx = 0, dy = 0, t0, active = null;
  deck.addEventListener('pointerdown', function (e) {
    var c = e.target.closest('.deck-card'); if (!c || c !== cards[order[0]]) return;
    active = c; sx = e.clientX; sy = e.clientY; dx = dy = 0; t0 = performance.now(); c.setPointerCapture(e.pointerId); c.classList.add('dragging');
  });
  deck.addEventListener('pointermove', function (e) {
    if (!active) return; dx = e.clientX - sx; dy = e.clientY - sy;
    active.style.transform = 'translate3d(' + dx + 'px,' + dy * .4 + 'px,40px) rotate(' + dx / 14 + 'deg)';
  });
  deck.addEventListener('pointerup', function () {
    if (!active) return; var c = active; active = null; c.classList.remove('dragging');
    var v = Math.abs(dx) / Math.max(1, performance.now() - t0);
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) { open(c, P[order[0]]); layout(); return; }
    if (Math.abs(dx) > 120 || v > .6) {
      var out = dx > 0 ? 1 : -1;
      c.style.transform = 'translate3d(' + out * 520 + 'px,' + dy * .4 + 'px,0) rotate(' + out * 28 + 'deg)'; c.style.opacity = 0;
      setTimeout(function () { cycle(1); }, 220);
    } else layout();
  });
  deck.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { cycle(1); cards[order[0]].focus(); }
    if (e.key === 'ArrowLeft') { cycle(-1); cards[order[0]].focus(); }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(cards[order[0]], P[order[0]]); }
  });
  document.getElementById('next').onclick = function () { cycle(1); };
  document.getElementById('prev').onclick = function () { cycle(-1); };
  layout();
})();
</script>
</body>
</html>
